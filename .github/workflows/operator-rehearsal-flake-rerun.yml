name: Operator rehearsal flake rerun

on:
  workflow_run:
    workflows: [Operator rehearsal]
    types: [completed]

permissions:
  actions: write
  issues: write
  contents: read

env:
  # Open issue "Operator rehearsal automatic reruns"; it holds one comment per automatic rerun.
  RERUN_TRACKING_ISSUE: 511

concurrency:
  group: operator-rehearsal-flake-rerun-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  classify-and-rerun:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.path == '.github/workflows/operator-rehearsal.yml' &&
      (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # workflow_run is privileged. Never use the triggering head or PR code.
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: Download untrusted report data
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          name: operator-rehearsal-${{ github.event.workflow_run.id }}-1
          path: ${{ runner.temp }}/rehearsal-flake-report
      - name: Classify JSON with trusted code
        id: classify
        run: python3 -I trusted/scripts/ci/rehearsal_flakes.py "$RUNNER_TEMP/rehearsal-flake-report" >> "$GITHUB_OUTPUT"
      - name: Rerun failed jobs once and record the signature
        if: steps.classify.outputs.signature != 'not-known'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SIGNATURE: ${{ steps.classify.outputs.signature }}
        shell: bash
        run: |
          set -euo pipefail
          case "$SIGNATURE" in
            lease-expired-flake|generator-saturation-flake) ;;
            *) exit 1 ;;
          esac
          # A queued handler must not rerun an attempt that has since changed.
          eligible=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq \
            '.run_attempt == 1 and .status == "completed" and .conclusion == "failure" and (.event == "pull_request" or .event == "push")')
          if [ "$eligible" != true ]; then
            printf '\nNo rerun: the live run is no longer eligible.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh run rerun "$RUN_ID" --repo "$GH_REPO" --failed
          # Only fixed text, an allow-listed signature and trusted run metadata.
          body="Automatic rerun: $SIGNATURE; $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$RUN_ID (attempt 1 -> 2)."
          gh api "repos/$GH_REPO/issues/$RERUN_TRACKING_ISSUE/comments" -f body="$body" --silent
