name: Release archives

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test (Redis integration skips without a dedicated endpoint)
        run: make test
      - name: Build all download archives
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="0.0.0-dev+$(git rev-parse --short HEAD)"
          if [ "$REF_TYPE" = tag ]; then version=${REF_NAME#v}; fi
          ./scripts/release/build-archives.sh "$version" dist
      # A manual run ends here: artifacts only, no release.
      - uses: actions/upload-artifact@v7
        with:
          name: release-archives
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          if-no-files-found: error

  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-archives
          path: dist
      - name: Create draft for the owner to publish by hand
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes "Release archives. The owner reviews and publishes this draft by hand." dist/*.tar.gz dist/checksums.txt
