name: Load generator calibration

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Calibration, capacity, soak, or both ramps (separate jobs)
        default: 'calibration'
        type: choice
        options: [calibration, capacity, custom-capacity, split-capacity, both, soak]
      split_callers:
        description: Fixed concurrent calls in every matched split-capacity sample (1..16)
        default: '2'
        type: string
      save_cpu_us:
        description: Custom gate operator Save CPU budget in microseconds per Handle event
        default: '1000'
        type: string
      save_wall_us:
        description: Custom gate operator Save wall-time budget in microseconds per Handle event
        default: '1000'
        type: string
      soak_callers:
        description: Concurrent soak calls
        default: '6'
        type: string
      soak_duration:
        description: Soak media duration (Go duration)
        default: '10m10s'
        type: string
      chaos_interval:
        description: Time between seeded soak events
        default: '30s'
        type: string
      seed:
        description: Reproducible soak schedule seed
        default: '41'
        type: string
      runner_label:
        description: Soak runner label; choose larger hardware for 50 calls
        default: 'ubuntu-latest'
        type: string
      generator_processes:
        description: Soak generators; 0 derives from callers_per_process
        default: '0'
        type: string
      soak_workers:
        description: N+1 worker pool size
        default: '3'
        type: string
      worker_floor:
        description: Measured worker floor for this runner and workload
        default: '8'
        type: string
      relay_floor:
        description: Measured relay floor for this runner and workload
        default: '8'
        type: string
      capacity_max:
        description: Maximum callers per bounded capacity ramp
        default: '16'
        type: string
      callers_per_process:
        description: Capacity callers per generator process (1 to 4)
        default: '2'
        type: string
      prices_json:
        description: Optional explicit machine and transfer price JSON
        default: ''
        type: string
      duration:
        description: Media duration per ramp step (Go duration)
        default: '30s'
        type: string
      max_callers:
        description: Maximum callers in one generator process
        default: '128'
        type: string
  schedule:
    - cron: '30 9 * * *'

permissions:
  contents: read

# Package jobs reserve 10m for the Ubuntu cache/install composite; driver limits stay fixed.
jobs:
  calibrate:
    if: github.event_name == 'schedule' || inputs.mode == 'calibration' || inputs.mode == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install throwaway Redis and media decoder
        uses: ./.github/actions/ubuntu-packages
        timeout-minutes: 10
        with:
          packages: redis-server ffmpeg
      - name: Build real-process binaries
        run: make build
      - name: Record runner
        run: |
          mkdir -p bin
          { uname -a; lscpu; go version; } > bin/calibration-runner.txt
      - name: Calibrate one generator process
        env:
          RAMP_DURATION: ${{ inputs.duration || '30s' }}
          RAMP_MAX: ${{ inputs.max_callers || '128' }}
        run: |
          ./bin/relais-load -calibrate -processes=1 -gomaxprocs=1 \
            -duration="$RAMP_DURATION" -calibration-max="$RAMP_MAX" \
            -output=bin/calibration-linux.json > bin/calibration-linux.log 2>&1
      - name: Print calibration evidence
        if: always()
        run: |
          if [ -f bin/calibration-linux.log ]; then cat bin/calibration-linux.log; fi
      - name: Upload reports and all process logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: load-calibration-linux-${{ github.run_id }}
          path: |
            bin/calibration-*
            bin/load-run-*
          if-no-files-found: warn
          retention-days: 14

  capacity:
    name: Capacity sample
    if: github.event_name == 'schedule' || inputs.mode == 'capacity' || inputs.mode == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install disposable topology dependencies
        uses: ./.github/actions/ubuntu-packages
        timeout-minutes: 10
        with:
          packages: redis-server ffmpeg iproute2 iptables procps
      - name: Build real-process binaries
        run: make build
      - name: Record runner and price inputs
        env:
          PRICE_INPUT: ${{ inputs.prices_json }}
        run: |
          { uname -a; lscpu; go version; } > bin/capacity-runner.txt
          if [ -n "$PRICE_INPUT" ]; then printf '%s\n' "$PRICE_INPUT" > bin/capacity-prices.json; fi
      - name: Measure Linux namespace LAN capacity and N+1
        timeout-minutes: 15
        env:
          SAMPLE_DURATION: ${{ inputs.duration || '30s' }}
          SAMPLE_MAX: ${{ inputs.capacity_max || '16' }}
          GENERATOR_CALLERS: ${{ inputs.callers_per_process || '2' }}
        run: |
          price_flags=()
          if [ -f bin/capacity-prices.json ]; then price_flags=(-prices=bin/capacity-prices.json); fi
          # Redirect logs as the checkout owner; only the topology needs root.
          # shellcheck disable=SC2024
          sudo -E ./bin/relais-load -capacity -topology=netns -workers=3 \
            -duration="$SAMPLE_DURATION" -capacity-max="$SAMPLE_MAX" \
            -callers-per-process="$GENERATOR_CALLERS" -gomaxprocs=1 \
            -output=bin/capacity-linux.json "${price_flags[@]}" > bin/capacity-linux.log 2>&1
      - name: Print evidence and check namespace cleanup
        if: always()
        run: |
          if [ -f bin/capacity-linux.log ]; then cat bin/capacity-linux.log; fi
          if sudo ip netns list | grep -E '^relais-net-'; then
            echo 'FAIL: owned topology namespaces remain'
            exit 1
          fi
      - name: Restore artifact ownership
        if: always()
        run: |
          sudo find bin -maxdepth 1 -type d -name 'load-run-*' -exec chown -R "$(id -u):$(id -g)" {} +
          sudo find bin -maxdepth 1 -type f -name 'capacity-*' -exec chown "$(id -u):$(id -g)" {} +
      - name: Upload reports and process logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: capacity-linux-${{ github.run_id }}
          path: |
            bin/capacity-*
            bin/load-run-*
          if-no-files-found: warn
          retention-days: 14

  soak:
    name: Soak with seeded chaos
    if: github.event_name == 'schedule' || inputs.mode == 'soak'
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install disposable topology dependencies
        uses: ./.github/actions/ubuntu-packages
        timeout-minutes: 10
        with:
          packages: redis-server ffmpeg iproute2 iptables procps
      - name: Build real-process binaries
        run: make build
      - name: Record runner
        run: |
          { uname -a; lscpu; go version; } > bin/soak-runner.txt
      - name: Run continuous calls with move, drain and SIGKILL
        timeout-minutes: 80
        env:
          CALLS: ${{ inputs.soak_callers || '6' }}
          DURATION: ${{ inputs.soak_duration || '10m10s' }}
          INTERVAL: ${{ inputs.chaos_interval || '30s' }}
          SEED: ${{ inputs.seed || '41' }}
          PROCESSES: ${{ inputs.generator_processes || '0' }}
          CALLERS_PER_PROCESS: ${{ inputs.callers_per_process || '2' }}
          WORKERS: ${{ inputs.soak_workers || '3' }}
          WORKER_FLOOR: ${{ inputs.worker_floor || '8' }}
          RELAY_FLOOR: ${{ inputs.relay_floor || '8' }}
        run: |
          process_flags=()
          if [ "$PROCESSES" != '0' ]; then process_flags=("-processes=$PROCESSES"); fi
          # Redirect logs as the checkout owner; only the topology needs root.
          # shellcheck disable=SC2024
          sudo -E ./bin/relais-load -soak -topology=netns \
            -callers="$CALLS" -duration="$DURATION" -chaos-interval="$INTERVAL" \
            -seed="$SEED" -workers="$WORKERS" -gomaxprocs=1 \
            -worker-floor="$WORKER_FLOOR" -relay-floor="$RELAY_FLOOR" \
            -callers-per-process="$CALLERS_PER_PROCESS" "${process_flags[@]}" \
            -output=bin/soak-linux.json > bin/soak-linux.log 2>&1
      - name: Print evidence and check namespace cleanup
        if: always()
        run: |
          if [ -f bin/soak-linux.log ]; then cat bin/soak-linux.log; fi
          if sudo ip netns list | grep -E '^relais-net-'; then
            echo 'FAIL: owned topology namespaces remain'
            exit 1
          fi
      - name: Restore artifact ownership
        if: always()
        run: |
          sudo find bin -maxdepth 1 -type d -name 'load-run-*' -exec chown -R "$(id -u):$(id -g)" {} +
          sudo find bin -maxdepth 1 -type f -name 'soak-*' -exec chown "$(id -u):$(id -g)" {} +
      - name: Upload report and all process logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: soak-linux-${{ github.run_id }}
          path: |
            bin/soak-*
            bin/load-run-*
          if-no-files-found: warn
          retention-days: 14


  custom-capacity:
    name: Manual custom-worker approval evidence
    # Deliberately absent from schedules, required CI, and release dependencies.
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'custom-capacity'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install disposable topology dependencies
        uses: ./.github/actions/ubuntu-packages
        timeout-minutes: 10
        with:
          packages: redis-server ffmpeg iproute2 iptables procps
      - name: Build exact custom worker
        run: |
          make build
          { uname -a; lscpu; go version; git rev-parse HEAD; sha256sum bin/delayed-loopback; ./bin/delayed-loopback -version; } > bin/custom-capacity-build.txt
      - name: Measure custom-worker capacity with default operator ceilings
        timeout-minutes: 20
        env:
          SAMPLE_DURATION: ${{ inputs.duration || '30s' }}
          SAMPLE_MAX: ${{ inputs.capacity_max || '16' }}
          GENERATOR_CALLERS: ${{ inputs.callers_per_process || '2' }}
        run: |
          # Driver owns every Redis/process/namespace. Stdout stays user-owned.
          # shellcheck disable=SC2024
          sudo -E ./bin/relais-load -capacity -topology=netns -workers=3 \
            -worker-bin="$PWD/bin/delayed-loopback" -agent=delayed-loopback/v1 \
            -duration="$SAMPLE_DURATION" -capacity-max="$SAMPLE_MAX" \
            -callers-per-process="$GENERATOR_CALLERS" -gomaxprocs=1 \
            -store-ops-budget=100 -store-bytes-budget=131072 \
            -output=bin/custom-capacity-linux.json > bin/custom-capacity-linux.log 2>&1
      - name: Restore artifact ownership and verify cleanup
        if: always()
        run: |
          sudo find bin -maxdepth 1 -type d -name 'load-run-*' -exec chown -R "$(id -u):$(id -g)" {} +
          sudo find bin -maxdepth 1 -type f -name 'custom-capacity-*' -exec chown "$(id -u):$(id -g)" {} +
          if sudo ip netns list | grep -E '^relais-net-'; then
            echo 'BLOCKING APPROVAL: owned topology namespaces remain'
            exit 1
          fi
      - name: Report evidence for owner approval and block over-budget results
        if: always()
        env:
          SAVE_CPU_US: ${{ inputs.save_cpu_us || '1000' }}
          SAVE_WALL_US: ${{ inputs.save_wall_us || '1000' }}
        run: |
          if [ -f bin/custom-capacity-linux.log ]; then cat bin/custom-capacity-linux.log; fi
          python3 -m unittest discover -s scripts/ci
          python3 scripts/ci/custom-capacity-report.py bin/custom-capacity-linux.json \
            --save-cpu-us="$SAVE_CPU_US" --save-wall-us="$SAVE_WALL_US"
      - name: Upload exact-build report and every process log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: custom-capacity-linux-${{ github.run_id }}
          path: |
            bin/custom-capacity-*
            bin/load-run-*
          if-no-files-found: warn
          retention-days: 14


  split-capacity:
    name: Matched split checkpoint traffic on one runner
    # Manual only. No schedules, required CI, release or paid runner dependencies.
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'split-capacity'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install disposable process topology dependencies
        uses: ./.github/actions/ubuntu-packages
        timeout-minutes: 10
        with:
          packages: redis-server ffmpeg procps
      - name: Build once and record exact runner and binaries
        run: |
          make build
          { uname -a; lscpu; go version; git rev-parse HEAD; sha256sum bin/relais-load bin/relais-worker bin/delayed-loopback bin/relais-relay bin/relais-control; } > bin/split-capacity-build.txt
      - name: Run all matched arms and split recovery scenarios on this runner
        timeout-minutes: 30
        env:
          SAMPLE_DURATION: ${{ inputs.duration || '30s' }}
          SAMPLE_CALLS: ${{ inputs.split_callers || '2' }}
        run: |
          ./bin/relais-load -split-capacity -topology=loopback -workers=3 \
            -callers="$SAMPLE_CALLS" -processes="$SAMPLE_CALLS" -gomaxprocs=1 \
            -duration="$SAMPLE_DURATION" -output=bin/split-capacity-linux.json \
            > bin/split-capacity-linux.log 2>&1
      - name: Report all gates and verify cleanup
        if: always()
        env:
          SAVE_CPU_US: ${{ inputs.save_cpu_us || '1000' }}
          SAVE_WALL_US: ${{ inputs.save_wall_us || '1000' }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          if [ -f bin/split-capacity-linux.log ]; then cat bin/split-capacity-linux.log; fi
          python3 -m unittest discover -s scripts/ci -p 'test_*capacity_report.py'
          python3 scripts/ci/custom-capacity-report.py bin/split-capacity-linux.json \
            --save-cpu-us="$SAVE_CPU_US" --save-wall-us="$SAVE_WALL_US"
      - name: Upload raw JSON, process logs, runner and gate report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: split-capacity-linux-${{ github.run_id }}
          path: |
            bin/split-capacity-*
            bin/load-run-*
          if-no-files-found: warn
          retention-days: 14
