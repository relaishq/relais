name: Operator rehearsal

on:
  pull_request:
    paths: &operator-paths
      - 'cmd/relais-gates/**'
      - 'cmd/relais-load/**'
      - 'internal/operator*/**'
      - 'pkg/operator/**'
      - 'internal/loadgen/**'
      - 'pkg/callharness/**'
      - 'internal/releasecompat/**'
      - 'pkg/buildinfo/**'
      - 'pkg/controlplane/**'
      - 'pkg/mediaworker/**'
      - 'pkg/relay/**'
      - 'pkg/sessionstore/**'
      - 'deploy/aws/**'
      - 'scripts/release/**'
      - 'scripts/ci/gate-mutation/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/actions/ubuntu-packages/**'
      - '.github/workflows/operator-rehearsal.yml'
  push:
    branches: [main]
    paths: *operator-paths
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operator-rehearsal-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
      - name: Install caller prerequisites
        timeout-minutes: 10
        uses: ./.github/actions/ubuntu-packages
        with:
          packages: ffmpeg chrony
      - name: Prepare compiler, modules and gate binary before media
        shell: bash
        run: |
          set -euo pipefail
          go mod download
          for pin in ae66240481edfd96b099ddb9aca787a59a5dbcac 9332472e781483cf37c2b51b111dd09ae9b6a92d; do
            source_dir=$(mktemp -d "$RUNNER_TEMP/relais-judge.XXXXXX")
            git archive "$pin" | tar -x -C "$source_dir"
            (cd "$source_dir" && GOTOOLCHAIN=local go mod download)
          done
          # Build once for both release-read and rehearsal; a 1 s later rebuild must match byte for byte.
          make operator-rehearsal-reproducible
          sha256sum bin/relais-gates bin/relais-load | tee "$RUNNER_TEMP/operator-binaries.sha256"
          mkdir -p runtime
      - name: Read and verify published releases
        env:
          # This is the only step receiving the read-only token. The Go reader
          # scopes it to the public API and removes it before starting children.
          RELAIS_RELEASE_TOKEN: ${{ github.token }}
        run: ./bin/relais-gates rehearse -prepare-only
      - name: Rehearse four gates with idle caller calibration
        env:
          TESTED_HEAD: ${{ github.event.pull_request.head.sha }}
          TESTED_EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          export GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)"
          # Rehearse with the exact binaries that prepared; never rebuild here.
          sha256sum --strict --check "$RUNNER_TEMP/operator-binaries.sha256"
          make operator-rehearsal-run OPERATOR_REHEARSAL_RUNNER='sudo -n --preserve-env=GOMODCACHE,GOCACHE' \
            OPERATOR_REHEARSAL_FLAGS="-prepared -head-commit=$TESTED_HEAD -event=$TESTED_EVENT"
      - name: Make sanitized artifacts available to uploader
        if: always()
        shell: bash
        run: |
          if [ -d runtime/operator-report ]; then
            sudo -n chown -R "$(id -u):$(id -g)" runtime/operator-report
          fi
      # Reads only report.json and clock-selection-status.json; never changes the job result.
      - name: Write result summary to the run page
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        run: python3 scripts/ci/rehearsal_summary.py runtime/operator-report >> "$GITHUB_STEP_SUMMARY"
      - name: Upload sanitized report, media evidence and redacted host diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime/operator-report/report.json
            runtime/operator-report/host-diagnostics.log
            runtime/operator-report/media-evidence.json
            runtime/operator-report/head-caller-evidence.json
            runtime/operator-report/clock-admission-evidence.json
            runtime/operator-report/clock-selection-policy.json
            runtime/operator-report/clock-selection.json
            runtime/operator-report/clock-selection-status.json
          if-no-files-found: warn
          retention-days: 14
