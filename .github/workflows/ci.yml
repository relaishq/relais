name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  schedule:
    - cron: '0 8 * * *' # Nightly at 08:00 UTC.
  workflow_dispatch:
    inputs:
      network_profile_lane:
        description: Network profile matrix to run (other CI jobs still run)
        type: choice
        options: [all, lossy-dc-move]
        default: all
      private_route_tuning:
        description: Tune private DC namespace routes with rto_min 5ms and quickack
        type: boolean
        default: true
      srtp_diagnostics:
        description: Capture caller SRTP failures and worker ciphertext metadata
        type: boolean
        default: false

# Only superseded PR runs share a cancellation group. Each full run is distinct.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Install dependencies
        run: make deps

      - name: Run go vet
        run: make vet

      - name: Run linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      - name: Build
        run: make build

      # The demo page's verdict logic decides the browser go/no-go.
      - name: Run demo metric tests
        run: node --test cmd/relais-demo/metrics.test.cjs

  # The build job is the aggregate gate while all work runs in parallel.
  # Making it required in GitHub settings is a separate admin decision.
  # always() turns a failed dependency into a failed check, rather than a skip.
  build:
    needs: [quality, unit-tests, timing-smoke, call-harness]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all essential checks
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          SMOKE_RESULT: ${{ needs.timing-smoke.result }}
          HARNESS_RESULT: ${{ needs.call-harness.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$UNIT_RESULT" = success
          test "$HARNESS_RESULT" = success
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$SMOKE_RESULT" = success
          fi

  benchmark:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Run benchmarks
        run: make bench

  unit-tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      RELAIS_TEST_REDIS_ADDR: "127.0.0.1:16379"
      RELAIS_TEST_REDIS_REQUIRE: "1"
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Run non-harness tests (race detector, Redis required)
        run: make test-unit

  # PRs run the short memory matrix plus a Redis uncertainty regression.
  # Main, nightly and manual runs exercise both stores in full.
  call-harness:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      RELAIS_TEST_REDIS_ADDR: "127.0.0.1:16379"
      RELAIS_TEST_REDIS_REQUIRE: "1"
      RELAIS_HARNESS_REQUIRE_FFMPEG: "1"
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Run short call harness (race detector, memory only)
        if: github.event_name == 'pull_request'
        run: make test-harness-short
      - name: Run Redis uncertainty regression (race detector, Redis required)
        if: github.event_name == 'pull_request'
        run: go test -race -v -count=1 -timeout 5m -run '^TestRelayUncertainTransferSurvives$' ./pkg/callharness/
      - name: Run full call harness (race detector, both stores)
        if: github.event_name != 'pull_request'
        run: make test-harness
      - name: Run shortened long-call recording check
        if: github.event_name != 'pull_request'
        env:
          RELAIS_LONG_RUN_DURATION: "2m"
        run: go test -v -count=1 -timeout 4m -run '^TestLongRunRecording$' ./pkg/callharness/
      - name: Run full relay timing gates (no race detector, both stores)
        if: github.event_name != 'pull_request'
        run: make test-harness-timing

  timing-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      RELAIS_HARNESS_REQUIRE_FFMPEG: "1"
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Run timing smoke (no race detector, memory only)
        run: make test-harness-smoke

  crash-run:
    timeout-minutes: 35
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Install Redis and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends redis-server ffmpeg
      # The driver starts and stops its own Redis on a free loopback port.
      - name: Run twenty interleaved SIGKILL trials (ten per mode)
        run: make crash-run
      - name: Upload crash-run failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: crash-run-logs
          path: bin/crash-run-*

  # Each lane runs twenty 60 s trials on an awake Linux runner. The driver
  # and relay children run as the same ordinary user; fencing reads /proc.
  relay-continuity:
    permissions:
      contents: read
    timeout-minutes: 35
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [relay-restart, relay-standby]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Install Redis and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends redis-server ffmpeg
      - name: Verify native process identity and stopped-child fencing
        shell: bash
        run: |
          set -o pipefail
          test "$(id -u)" -ne 0
          mkdir -p bin
          go test -race -v -count=1 ./internal/processidentity/ | tee bin/relay-continuity-fencing.log
      # Restart compares ten restore-on and ten restore-off trials. Standby
      # compares ten SIGKILL and ten SIGSTOP trials. Redis is driver-owned.
      - name: Run relay continuity acceptance
        shell: bash
        run: |
          set -o pipefail
          make crash-run CRASH_FLAGS="-${{ matrix.mode }} -runs=10 -after=60s" |& tee bin/relay-continuity-driver.log
      - name: Upload relay continuity failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relay-continuity-${{ matrix.mode }}-logs
          path: |
            bin/relay-continuity-*.log
            bin/crash-run-*

  # Ten consecutive buffered SIGKILL trials, each observing 60 seconds,
  # separate from the phase-1 cache and relay-continuity comparisons.
  crash-run-buffer:
    timeout-minutes: 35
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Install Redis and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends redis-server ffmpeg
      - name: Accept ten consecutive buffered SIGKILL trials (lan)
        run: make crash-run CRASH_FLAGS="-buffer -runs=10 -after=60s"
      - name: Upload buffered crash-run failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: crash-run-buffer-logs
          path: bin/crash-run-*

  cluster-tests-gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Gate cluster tests
        id: gate
        env:
          RELAIS_TEST_REDIS_CLUSTER_ADDRS: ${{ secrets.RELAIS_TEST_REDIS_CLUSTER_ADDRS }}
        run: |
          if [ -n "${RELAIS_TEST_REDIS_CLUSTER_ADDRS}" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  cluster-tests:
    needs: cluster-tests-gate
    if: ${{ needs.cluster-tests-gate.outputs.should_run == 'true' }}
    env:
      RELAIS_TEST_REDIS_CLUSTER_ADDRS: ${{ secrets.RELAIS_TEST_REDIS_CLUSTER_ADDRS }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Install dependencies
        run: make deps

      - name: Run Redis Cluster tests
        run: make test-cluster

  netns-crash-run:
    timeout-minutes: 35
    permissions:
      contents: read
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Install namespace tools, Redis and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends iproute2 iptables procps redis-server ffmpeg
      - name: Build as the normal user
        run: |
          make build
          go test -c -o bin/nettopology.test ./internal/nettopology
          go test -c -o bin/clusterprocess.test ./internal/clusterprocess
      - name: Verify namespace isolation and cleanup
        run: |
          set -o pipefail
          sudo -E env RELAIS_TEST_NETNS_REQUIRE=1 ./bin/nettopology.test -test.v -test.skip='^Test(LinuxProfile|Profile)' -test.timeout=3m 2>&1 | tee bin/netns-tests.log
          sudo -E ./bin/clusterprocess.test -test.v -test.run='^Test(NamespaceCommand|ManagerCleanupAfterChildren|StopReapedChildCannotSignalReusedGroup|DriverDoubleSignalCleanup)$' -test.timeout=3m 2>&1 | tee bin/netns-process-tests.log
      - name: Run twenty namespaced LAN SIGKILL trials (ten per mode)
        timeout-minutes: 28
        run: |
          set -o pipefail
          sudo -E env RELAIS_REDIS_ADDR= ./bin/crash-run -topology=netns -profile=lan 2>&1 | tee bin/netns-crash-run.log
      - name: Assert namespace and link cleanup
        if: always()
        timeout-minutes: 1
        run: |
          set -o pipefail
          mkdir -p bin
          sudo ip netns list | tee bin/netns-leftover-namespaces.log
          sudo ip -j link show | tee bin/netns-leftover-links.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          namespaces = [line.split()[0] for line in Path('bin/netns-leftover-namespaces.log').read_text().splitlines() if line.strip()]
          links = [link['ifname'] for link in json.loads(Path('bin/netns-leftover-links.log').read_text())]
          leftovers = [name for name in namespaces if name.startswith('relais-net-')]
          leftovers += [name for name in links if name.startswith('rn')]
          if leftovers:
              raise SystemExit('Namespace cleanup failed; remaining resources: ' + ', '.join(leftovers))
          print('CLEANUP PASS: no relais-net-* namespaces or rn* links remain')
          PY
      - name: Restore ownership and readability of driver logs
        if: always()
        run: |
          sudo find bin -maxdepth 1 -type d -name 'crash-run-*' -exec chown -R "$(id -u):$(id -g)" {} +
          sudo find bin -maxdepth 1 -type d -name 'crash-run-*' -exec chmod -R a+rX {} +
      - name: Upload namespace route settings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: netns-crash-run-route-settings
          path: bin/crash-run-*/private-route-settings.json
      - name: Upload namespace failure logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: netns-crash-run-logs
          path: |
            bin/netns-*.log
            bin/crash-run-*

  # Profile thresholds are only judged on nightly/manual native Linux runs.
  # This is deliberately outside the PR aggregate and main-push lanes.
  netns-network-profiles:
    name: netns-network-profiles (${{ matrix.profile }}, ${{ matrix.scenario }})
    timeout-minutes: ${{ matrix.job_minutes }}
    permissions:
      contents: read
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(inputs.network_profile_lane == 'lossy-dc-move' && '["lossy-dc"]' || '["lan","region","far-caller","lossy-dc"]') }}
        scenario: ${{ fromJSON(inputs.network_profile_lane == 'lossy-dc-move' && '["move"]' || '["move","takeover"]') }}
        include: ${{ fromJSON(inputs.network_profile_lane == 'lossy-dc-move' && '[{"scenario":"move","trials":20,"driver_minutes":35,"job_minutes":45}]' || '[{"scenario":"move","trials":20,"driver_minutes":35,"job_minutes":45},{"scenario":"takeover","trials":10,"driver_minutes":20,"job_minutes":30}]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Install namespace tools, Redis and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends iproute2 iptables procps redis-server ffmpeg
      - name: Build as the normal user
        run: |
          make build
          go test -c -o bin/nettopology.test ./internal/nettopology
      - name: Verify real profile delay, host safety and cleanup
        run: |
          set -o pipefail
          sudo -E env RELAIS_TEST_NETNS_REQUIRE=1 ./bin/nettopology.test -test.v -test.run='^TestLinuxProfile' -test.timeout=2m 2>&1 | tee bin/network-profile-tests.log
      - name: Judge buffered profile trials
        id: judge
        timeout-minutes: ${{ matrix.driver_minutes }}
        env:
          PRIVATE_ROUTE_TUNING: ${{ github.event_name != 'workflow_dispatch' || inputs.private_route_tuning }}
          RELAIS_SRTP_DIAGNOSTICS: ${{ inputs.srtp_diagnostics && '1' || '0' }}
        run: |
          set -o pipefail
          {
            uname -a
            if [ -r /proc/version_signature ]; then cat /proc/version_signature; fi
          } | tee bin/network-profile-kernel.log
          sudo -E env RELAIS_REDIS_ADDR= ./bin/crash-run -private-route-tuning="$PRIVATE_ROUTE_TUNING" -topology=netns -profile=${{ matrix.profile }} -scenario=${{ matrix.scenario }} -runs=${{ matrix.trials }} -after=60s 2>&1 | tee bin/network-profile-driver.log
      - name: Assert namespace and link cleanup
        if: always()
        timeout-minutes: 1
        run: |
          set -o pipefail
          mkdir -p bin
          sudo ip netns list | tee bin/network-profile-leftover-namespaces.log
          sudo ip -j link show | tee bin/network-profile-leftover-links.log
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          namespaces = [line.split()[0] for line in Path('bin/network-profile-leftover-namespaces.log').read_text().splitlines() if line.strip()]
          links = [link['ifname'] for link in json.loads(Path('bin/network-profile-leftover-links.log').read_text())]
          leftovers = [name for name in namespaces if name.startswith('relais-net-')]
          leftovers += [name for name in links if name.startswith('rn')]
          if leftovers:
              raise SystemExit('Namespace cleanup failed: ' + ', '.join(leftovers))
          print('CLEANUP PASS: no owned namespaces or links remain')
          PYTHON
      - name: Restore report ownership and readability
        if: always()
        run: |
          sudo find bin -maxdepth 1 -type d -name 'crash-run-*' -exec chown -R "$(id -u):$(id -g)" {} +
          sudo find bin -maxdepth 1 -type d -name 'crash-run-*' -exec chmod -R a+rX {} +
      - name: Upload profile results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: network-profile-${{ matrix.profile }}-${{ matrix.scenario }}-results
          path: |
            bin/crash-run-*/profile-report.json
            bin/crash-run-*/network-settings.json
            bin/crash-run-*/private-route-settings.json
            bin/network-profile-kernel.log
      - name: Upload profile failure logs
        if: failure() || cancelled() || steps.judge.outcome == 'failure' || inputs.srtp_diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: network-profile-${{ matrix.profile }}-${{ matrix.scenario }}-logs
          path: |
            bin/network-profile-*.log
            bin/crash-run-*
