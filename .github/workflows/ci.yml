name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  schedule:
    - cron: '0 8 * * *' # Nightly at 08:00 UTC.
  workflow_dispatch:
    inputs:
      network_profile_lane:
        description: Network profile lane (nvwa-dc-vs-ws runs only the spike comparison)
        type: choice
        options: [all, lossy-dc-move, nvwa-dc-vs-ws]
        default: all
      private_route_tuning:
        description: Tune private DC namespace routes with rto_min 5ms and quickack
        type: boolean
        default: true
      srtp_diagnostics:
        description: Capture caller SRTP failures and worker ciphertext metadata
        type: boolean
        default: false
      profile_trials:
        description: Override trials for every selected network-profile cell (diagnostic hunts)
        type: string
        default: ''
      profile_after:
        description: Override post-event observation, e.g. 10s (below 60s skips consent acceptance)
        type: string
        default: ''

# Only superseded PR runs share a cancellation group. Each full run is distinct.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    if: inputs.network_profile_lane != 'nvwa-dc-vs-ws'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Install dependencies
        run: make deps

      - name: Run go vet
        run: make vet

      - name: Run linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      - name: Build worker from an external module without CGO
        run: go test -count=1 -run '^TestExternalModuleBuild$' ./pkg/workerapp

      - name: Build
        run: make build

      # The demo page's verdict logic decides the browser go/no-go.
      - name: Run demo page tests
        run: node --test cmd/relais-demo/*.test.cjs

  # The build job is the aggregate gate while all work runs in parallel.
  # Making it required in GitHub settings is a separate admin decision.
  # always() turns a failed dependency into a failed check, rather than a skip.
  build:
    needs: [quality, unit-tests, timing-smoke, call-harness]
    if: ${{ inputs.network_profile_lane != 'nvwa-dc-vs-ws' && (always()) }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all essential checks
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          SMOKE_RESULT: ${{ needs.timing-smoke.result }}
          HARNESS_RESULT: ${{ needs.call-harness.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$UNIT_RESULT" = success
          test "$HARNESS_RESULT" = success
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$SMOKE_RESULT" = success
          fi

  benchmark:
    if: ${{ inputs.network_profile_lane != 'nvwa-dc-vs-ws' && (github.event_name != 'pull_request') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Run benchmarks
        run: make bench

  unit-tests:
    if: inputs.network_profile_lane != 'nvwa-dc-vs-ws'
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      RELAIS_TEST_REDIS_ADDR: "127.0.0.1:16379"
      RELAIS_TEST_REDIS_REQUIRE: "1"
      RELAIS_TEST_REDIS_TLS_REQUIRE: "1"
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Install Redis executable without starting a service
        run: |
          printf '#!/bin/sh\nexit 101\n' > "$RUNNER_TEMP/policy-rc.d"
          if [ -e /usr/sbin/policy-rc.d ]; then
            sudo cp -p /usr/sbin/policy-rc.d "$RUNNER_TEMP/original-policy-rc.d"
            trap 'sudo cp -p "$RUNNER_TEMP/original-policy-rc.d" /usr/sbin/policy-rc.d' EXIT
          else
            trap 'sudo rm -f /usr/sbin/policy-rc.d' EXIT
          fi
          sudo install -m 755 "$RUNNER_TEMP/policy-rc.d" /usr/sbin/policy-rc.d
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends redis-server
      - name: Run non-harness tests (race detector, Redis required)
        run: make test-unit

  # PRs run the short memory matrix plus a Redis uncertainty regression.
  # Main, nightly and manual runs exercise both stores in full.
  call-harness:
    if: inputs.network_profile_lane != 'nvwa-dc-vs-ws'
    # Includes the 15-minute PR suite and the longer main/nightly matrix.
    timeout-minutes: 90
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      RELAIS_TEST_REDIS_ADDR: "127.0.0.1:16379"
      RELAIS_TEST_REDIS_REQUIRE: "1"
      RELAIS_HARNESS_REQUIRE_FFMPEG: "1"
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Run short call harness (race detector, memory only)
        if: github.event_name == 'pull_request'
        run: make test-harness-short
      - name: Run Redis uncertainty regression (race detector, Redis required)
        if: github.event_name == 'pull_request'
        run: go test -race -v -count=1 -timeout 5m -run '^TestRelayUncertainTransferSurvives$' ./pkg/callharness/
      - name: Run full call harness (race detector, both stores)
        if: github.event_name != 'pull_request'
        run: make test-harness
      - name: Run shortened long-call recording check
        if: github.event_name != 'pull_request'
        env:
          RELAIS_LONG_RUN_DURATION: "2m"
        run: go test -v -count=1 -timeout 4m -run '^TestLongRunRecording$' ./pkg/callharness/
      - name: Run full relay timing gates (no race detector, both stores)
        if: github.event_name != 'pull_request'
        run: make test-harness-timing

  timing-smoke:
    if: ${{ inputs.network_profile_lane != 'nvwa-dc-vs-ws' && (github.event_name == 'pull_request') }}
    runs-on: ubuntu-latest
    env:
      RELAIS_HARNESS_REQUIRE_FFMPEG: "1"
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Run timing smoke (no race detector, memory only)
        run: make test-harness-smoke

  crash-run:
    timeout-minutes: 35
    if: ${{ inputs.network_profile_lane != 'nvwa-dc-vs-ws' && (github.event_name != 'pull_request') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Install Redis and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends redis-server ffmpeg
      # Ubuntu's redis-server package is built with TLS. Require the fixture
      # here so a missing executable or TLS support cannot silently skip CI.
      - name: Verify Redis TLS and ACL connections (race detector)
        env:
          RELAIS_TEST_REDIS_TLS_REQUIRE: "1"
        run: go test -race -v -count=1 -timeout 1m -run '^TestRedisTLSACLIntegration$' ./internal/processrun/
      # Separate-process attachment builds its own binaries and owns Redis.
      # Keep this in the existing process lane until its cold-build PR cost is measured.
      - name: Verify attached demo process faults (race detector)
        env:
          RELAIS_TEST_REDIS_REQUIRE: "1"
          RELAIS_HARNESS_REQUIRE_FFMPEG: "1"
        run: go test -race -v -count=1 -timeout 5m -run '^TestDemoAttachExternalSmoke$' ./cmd/relais-demo/
      # The driver starts and stops its own Redis on a free loopback port.
      - name: Run twenty interleaved SIGKILL trials (ten per mode)
        if: ${{ !cancelled() }}
        run: make crash-run
      - name: Upload crash-run failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: crash-run-logs
          path: |
            bin/crash-run-*
            bin/attach-smoke-*

  # Each lane runs twenty 60 s trials on an awake Linux runner. The driver
  # and relay children run as the same ordinary user; fencing reads /proc.
  relay-continuity:
    permissions:
      contents: read
    timeout-minutes: 35
    if: ${{ inputs.network_profile_lane != 'nvwa-dc-vs-ws' && (github.event_name != 'pull_request') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [relay-restart, relay-standby]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Install Redis and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends redis-server ffmpeg
      - name: Verify native process identity and stopped-child fencing
        shell: bash
        run: |
          set -o pipefail
          test "$(id -u)" -ne 0
          mkdir -p bin
          go test -race -v -count=1 ./internal/processidentity/ | tee bin/relay-continuity-fencing.log
      # Restart compares ten restore-on and ten restore-off trials. Standby
      # compares ten SIGKILL and ten SIGSTOP trials. Redis is driver-owned.
      - name: Run relay continuity acceptance
        shell: bash
        run: |
          set -o pipefail
          make crash-run CRASH_FLAGS="-${{ matrix.mode }} -runs=10 -after=60s" |& tee bin/relay-continuity-driver.log
      - name: Upload relay continuity failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relay-continuity-${{ matrix.mode }}-logs
          path: |
            bin/relay-continuity-*.log
            bin/crash-run-*

  # Ten consecutive buffered SIGKILL trials, each observing 60 seconds,
  # separate from the phase-1 cache and relay-continuity comparisons.
  crash-run-buffer:
    timeout-minutes: 35
    if: ${{ inputs.network_profile_lane != 'nvwa-dc-vs-ws' && (github.event_name != 'pull_request') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Install Redis and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends redis-server ffmpeg
      - name: Accept ten consecutive buffered SIGKILL trials (lan)
        run: make crash-run CRASH_FLAGS="-buffer -runs=10 -after=60s"
      - name: Upload buffered crash-run failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: crash-run-buffer-logs
          path: bin/crash-run-*

  store-stall:
    timeout-minutes: 25
    if: ${{ inputs.network_profile_lane != 'nvwa-dc-vs-ws' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Install Redis and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends redis-server ffmpeg
      - name: Build process driver
        run: make build
      # Only driver-owned Redis is paused; five calls per duration and variant.
      - name: Accept five moderate store stalls
        run: ./bin/crash-run -store-stall=moderate -runs=5 -after=10s
      - name: Accept five long store stalls
        run: ./bin/crash-run -store-stall=long -runs=5 -after=10s
      - name: Accept five live-worker stalls at each budget duration
        run: |
          for duration in 5s 15s 29s; do
            ./bin/crash-run -store-stall=live -store-stall-duration="$duration" -runs=5 -after=10s
          done
      - name: Accept five beyond-budget ownership losses
        run: ./bin/crash-run -store-stall=expired -store-stall-duration=35s -runs=5 -after=10s
      - name: Upload store-stall failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: store-stall-logs
          path: bin/crash-run-*

  cluster-tests-gate:
    if: inputs.network_profile_lane != 'nvwa-dc-vs-ws'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Gate cluster tests
        id: gate
        env:
          RELAIS_TEST_REDIS_CLUSTER_ADDRS: ${{ secrets.RELAIS_TEST_REDIS_CLUSTER_ADDRS }}
        run: |
          if [ -n "${RELAIS_TEST_REDIS_CLUSTER_ADDRS}" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  cluster-tests:
    needs: cluster-tests-gate
    if: ${{ inputs.network_profile_lane != 'nvwa-dc-vs-ws' && (needs.cluster-tests-gate.outputs.should_run == 'true') }}
    env:
      RELAIS_TEST_REDIS_CLUSTER_ADDRS: ${{ secrets.RELAIS_TEST_REDIS_CLUSTER_ADDRS }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Install dependencies
        run: make deps

      - name: Run Redis Cluster tests
        run: make test-cluster

  netns-crash-run:
    timeout-minutes: 35
    permissions:
      contents: read
    if: ${{ inputs.network_profile_lane != 'nvwa-dc-vs-ws' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Install namespace tools, Redis and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends iproute2 iptables procps redis-server ffmpeg
      - name: Build as the normal user
        run: |
          make build
          go test -c -o bin/nettopology.test ./internal/nettopology
          go test -c -o bin/clusterprocess.test ./internal/clusterprocess
      - name: Verify namespace isolation and cleanup
        run: |
          set -o pipefail
          sudo -E env RELAIS_TEST_NETNS_REQUIRE=1 ./bin/nettopology.test -test.v -test.skip='^Test(LinuxProfile|Profile)' -test.timeout=3m 2>&1 | tee bin/netns-tests.log
          sudo -E ./bin/clusterprocess.test -test.v -test.run='^Test(NamespaceCommand|ManagerCleanupAfterChildren|StopReapedChildCannotSignalReusedGroup|DriverDoubleSignalCleanup)$' -test.timeout=3m 2>&1 | tee bin/netns-process-tests.log
      - name: Run twenty namespaced LAN SIGKILL trials (ten per mode)
        timeout-minutes: 28
        run: |
          set -o pipefail
          sudo -E env RELAIS_REDIS_ADDR= ./bin/crash-run -topology=netns -profile=lan 2>&1 | tee bin/netns-crash-run.log
      - name: Assert namespace and link cleanup
        if: always()
        timeout-minutes: 1
        run: |
          set -o pipefail
          mkdir -p bin
          sudo ip netns list | tee bin/netns-leftover-namespaces.log
          sudo ip -j link show | tee bin/netns-leftover-links.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          namespaces = [line.split()[0] for line in Path('bin/netns-leftover-namespaces.log').read_text().splitlines() if line.strip()]
          links = [link['ifname'] for link in json.loads(Path('bin/netns-leftover-links.log').read_text())]
          leftovers = [name for name in namespaces if name.startswith('relais-net-')]
          leftovers += [name for name in links if name.startswith('rn')]
          if leftovers:
              raise SystemExit('Namespace cleanup failed; remaining resources: ' + ', '.join(leftovers))
          print('CLEANUP PASS: no relais-net-* namespaces or rn* links remain')
          PY
      - name: Restore ownership and readability of driver logs
        if: always()
        run: |
          sudo find bin -maxdepth 1 -type d -name 'crash-run-*' -exec chown -R "$(id -u):$(id -g)" {} +
          sudo find bin -maxdepth 1 -type d -name 'crash-run-*' -exec chmod -R a+rX {} +
      - name: Upload namespace route settings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: netns-crash-run-route-settings
          path: bin/crash-run-*/private-route-settings.json
      - name: Upload namespace failure logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: netns-crash-run-logs
          path: |
            bin/netns-*.log
            bin/crash-run-*

  # Profile thresholds are only judged on nightly/manual native Linux runs.
  # This is deliberately outside the PR aggregate and main-push lanes.
  netns-network-profiles:
    name: netns-network-profiles (${{ matrix.profile }}, ${{ matrix.scenario }})
    timeout-minutes: ${{ matrix.job_minutes }}
    permissions:
      contents: read
    if: ${{ inputs.network_profile_lane != 'nvwa-dc-vs-ws' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(inputs.network_profile_lane == 'lossy-dc-move' && '["lossy-dc"]' || '["lan","region","far-caller","lossy-dc"]') }}
        scenario: ${{ fromJSON(inputs.network_profile_lane == 'lossy-dc-move' && '["move"]' || '["move","takeover"]') }}
        include: ${{ fromJSON(inputs.network_profile_lane == 'lossy-dc-move' && '[{"scenario":"move","trials":20,"driver_minutes":35,"job_minutes":45}]' || '[{"scenario":"move","trials":20,"driver_minutes":35,"job_minutes":45},{"scenario":"takeover","trials":10,"driver_minutes":20,"job_minutes":30}]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Install namespace tools, Redis and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends iproute2 iptables procps redis-server ffmpeg
      - name: Build as the normal user
        run: |
          make build
          go test -c -o bin/nettopology.test ./internal/nettopology
      - name: Verify real profile delay, host safety and cleanup
        run: |
          set -o pipefail
          sudo -E env RELAIS_TEST_NETNS_REQUIRE=1 ./bin/nettopology.test -test.v -test.run='^TestLinuxProfile' -test.timeout=2m 2>&1 | tee bin/network-profile-tests.log
      - name: Choose SRTP diagnostics
        env:
          REQUESTED: ${{ inputs.srtp_diagnostics && '1' || '0' }}
          NIGHTLY_LOSSY_MOVE: ${{ github.event_name == 'schedule' && matrix.profile == 'lossy-dc' && matrix.scenario == 'move' }}
        run: |
          value="$REQUESTED"
          # #51: traced nights leave packet evidence for a rare rollback auth
          # failure; untraced nights keep judging timing without tracing cost
          # and show whether tracing hides the fault. Failed runs upload logs.
          if [ "$NIGHTLY_LOSSY_MOVE" = true ] && [ $((10#$(date -u +%j) % 2)) -eq 0 ]; then
            value=1
          fi
          echo "RELAIS_SRTP_DIAGNOSTICS=$value" >> "$GITHUB_ENV"
          echo "SRTP diagnostics: $value"
      - name: Judge buffered profile trials
        id: judge
        timeout-minutes: ${{ matrix.driver_minutes }}
        env:
          PRIVATE_ROUTE_TUNING: ${{ github.event_name != 'workflow_dispatch' || inputs.private_route_tuning }}
          PROFILE_TRIALS: ${{ inputs.profile_trials || matrix.trials }}
          PROFILE_AFTER: ${{ inputs.profile_after || '60s' }}
        run: |
          set -o pipefail
          {
            uname -a
            if [ -r /proc/version_signature ]; then cat /proc/version_signature; fi
          } | tee bin/network-profile-kernel.log
          sudo -E env RELAIS_REDIS_ADDR= ./bin/crash-run -private-route-tuning="$PRIVATE_ROUTE_TUNING" -topology=netns -profile=${{ matrix.profile }} -scenario=${{ matrix.scenario }} -runs="$PROFILE_TRIALS" -after="$PROFILE_AFTER" 2>&1 | tee bin/network-profile-driver.log
      - name: Assert namespace and link cleanup
        if: always()
        timeout-minutes: 1
        run: |
          set -o pipefail
          mkdir -p bin
          sudo ip netns list | tee bin/network-profile-leftover-namespaces.log
          sudo ip -j link show | tee bin/network-profile-leftover-links.log
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          namespaces = [line.split()[0] for line in Path('bin/network-profile-leftover-namespaces.log').read_text().splitlines() if line.strip()]
          links = [link['ifname'] for link in json.loads(Path('bin/network-profile-leftover-links.log').read_text())]
          leftovers = [name for name in namespaces if name.startswith('relais-net-')]
          leftovers += [name for name in links if name.startswith('rn')]
          if leftovers:
              raise SystemExit('Namespace cleanup failed: ' + ', '.join(leftovers))
          print('CLEANUP PASS: no owned namespaces or links remain')
          PYTHON
      - name: Restore report ownership and readability
        if: always()
        run: |
          sudo find bin -maxdepth 1 -type d -name 'crash-run-*' -exec chown -R "$(id -u):$(id -g)" {} +
          sudo find bin -maxdepth 1 -type d -name 'crash-run-*' -exec chmod -R a+rX {} +
      - name: Upload profile results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: network-profile-${{ matrix.profile }}-${{ matrix.scenario }}-results
          path: |
            bin/crash-run-*/profile-report.json
            bin/crash-run-*/network-settings.json
            bin/crash-run-*/private-route-settings.json
            bin/network-profile-kernel.log
      - name: Upload profile failure logs
        if: failure() || cancelled() || steps.judge.outcome == 'failure' || inputs.srtp_diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: network-profile-${{ matrix.profile }}-${{ matrix.scenario }}-logs
          path: |
            bin/network-profile-*.log
            bin/crash-run-*

  # Disposable spike lane: never enters the normal aggregate or main defaults.
  nvwa-dc-vs-ws:
    if: github.event_name == 'workflow_dispatch' && inputs.network_profile_lane == 'nvwa-dc-vs-ws'
    timeout-minutes: 35
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [lan, region, far-caller, lossy-dc, poor-wifi]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install namespace tools and fixtures without starting Redis
        shell: bash
        run: |
          set -euo pipefail
          printf '#!/bin/sh\nexit 101\n' > "$RUNNER_TEMP/policy-rc.d"
          if [ -e /usr/sbin/policy-rc.d ]; then
            sudo cp -p /usr/sbin/policy-rc.d "$RUNNER_TEMP/original-policy-rc.d"
            trap 'sudo cp -p "$RUNNER_TEMP/original-policy-rc.d" /usr/sbin/policy-rc.d' EXIT
          else
            trap 'sudo rm -f /usr/sbin/policy-rc.d' EXIT
          fi
          sudo install -m 755 "$RUNNER_TEMP/policy-rc.d" /usr/sbin/policy-rc.d
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iproute2 iptables procps redis-server ffmpeg
      - name: Build spike and namespace checks as the normal user
        run: |
          go mod download
          bash experiments/nvwa-room/scripts/build.sh "$RUNNER_TEMP/nvwa-build"
          go test -c -o "$RUNNER_TEMP/nvwa-build/bin/nettopology.test" ./internal/nettopology
          go test -c -o "$RUNNER_TEMP/nvwa-build/bin/clusterprocess.test" ./internal/clusterprocess
      - name: Verify comparison policies and evidence reducer
        run: |
          go test -race ./experiments/nvwa-room/...
          python3 experiments/nvwa-room/scripts/test_network_summary.py
          python3 experiments/nvwa-room/scripts/test_network_runner.py
      - name: Verify namespace isolation, profile delay and cleanup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin/nvwa-network
          sudo -E env RELAIS_TEST_NETNS_REQUIRE=1 "$RUNNER_TEMP/nvwa-build/bin/nettopology.test" -test.v -test.timeout=4m 2>&1 | tee bin/nvwa-network/netns-tests.log
          sudo -E "$RUNNER_TEMP/nvwa-build/bin/clusterprocess.test" -test.v -test.run='^Test(NamespaceCommand|ManagerCleanupAfterChildren|StopReapedChildCannotSignalReusedGroup|DriverDoubleSignalCleanup)$' -test.timeout=3m 2>&1 | tee bin/nvwa-network/netns-process-tests.log
      - name: Run paired fixed-cadence comparison
        timeout-minutes: 28
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/nvwa-build/build-sha256.txt" "$RUNNER_TEMP/nvwa-build/runtime-source-sha256.json" bin/nvwa-network/
          uname -a | tee bin/nvwa-network/kernel.log
          sudo -E python3 experiments/nvwa-room/scripts/run-network.py --scratch "$RUNNER_TEMP/nvwa-build" --out bin/nvwa-network/${{ matrix.profile }} --topology netns --profile ${{ matrix.profile }}
      - name: Reclaim this profile's recorded stale topology owners
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin/nvwa-network
          if [ -x "$RUNNER_TEMP/nvwa-build/bin/network-driver" ]; then
            sudo -E "$RUNNER_TEMP/nvwa-build/bin/network-driver" -cleanup-root bin/nvwa-network/${{ matrix.profile }} 2>&1 | tee bin/nvwa-network/reclaim.log
          fi
      - name: Assert namespace and link cleanup
        if: always()
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin/nvwa-network
          sudo ip netns list | tee bin/nvwa-network/leftover-namespaces.log
          sudo ip -j link show | tee bin/nvwa-network/leftover-links.log
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          root = Path('bin/nvwa-network')
          namespaces = [line.split()[0] for line in (root / 'leftover-namespaces.log').read_text().splitlines() if line.strip()]
          links = [link['ifname'] for link in json.loads((root / 'leftover-links.log').read_text())]
          leftovers = [name for name in namespaces if name.startswith('relais-net-')]
          leftovers += [name for name in links if name.startswith('rn')]
          if leftovers:
              raise SystemExit('Namespace cleanup failed: ' + ', '.join(leftovers))
          print('CLEANUP PASS: no owned namespaces or links remain')
          PYTHON
      - name: Restore evidence ownership and readability
        if: always()
        run: |
          mkdir -p bin/nvwa-network
          sudo chown -R "$(id -u):$(id -g)" bin/nvwa-network
          sudo find bin/nvwa-network -type d -exec chmod a+rx {} +
          sudo find bin/nvwa-network -type f ! -name redis-auth.conf -exec chmod a+r {} +
          sudo find bin/nvwa-network -type f -name redis-auth.conf -exec chmod 600 {} +
      - name: Publish summary table
        if: always()
        shell: bash
        run: |
          python3 experiments/nvwa-room/scripts/summarize-network.py bin/nvwa-network
          cat bin/nvwa-network/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload raw comparison and summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nvwa-network-${{ matrix.profile }}
          if-no-files-found: error
          path: |
            bin/nvwa-network/build-sha256.txt
            bin/nvwa-network/runtime-source-sha256.json
            bin/nvwa-network/summary.json
            bin/nvwa-network/summary.md
            bin/nvwa-network/**/*.log
            bin/nvwa-network/**/ledger.json
            bin/nvwa-network/**/matrix-plan.json
            bin/nvwa-network/**/cell-status.json
            bin/nvwa-network/**/runner-status.json
            bin/nvwa-network/**/namespace-owner.json
            bin/nvwa-network/**/result.json.gz
            bin/nvwa-network/**/network-settings.json
            bin/nvwa-network/**/topology.json
