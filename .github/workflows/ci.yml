name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Install dependencies
        run: make deps

      - name: Run tests
        run: make test

      - name: Run linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      - name: Build
        run: make build

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Run benchmarks
        run: make bench

  call-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      # The harness decodes every echoed VP8 frame with ffmpeg when it is on
      # PATH; RELAIS_HARNESS_REQUIRE_FFMPEG turns a skipped decode into a
      # failure so CI never passes without it.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run call harness tests (race detector)
        env:
          RELAIS_HARNESS_REQUIRE_FFMPEG: "1"
        run: make test-harness

      # The race detector slows the media path several times over, so the
      # relay move and drain gap targets are enforced in a run without it.
      - name: Run relay timing tests (no race detector)
        env:
          RELAIS_HARNESS_REQUIRE_FFMPEG: "1"
        run: make test-harness-timing

  cluster-tests-gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Gate cluster tests
        id: gate
        env:
          RELAIS_TEST_REDIS_CLUSTER_ADDRS: ${{ secrets.RELAIS_TEST_REDIS_CLUSTER_ADDRS }}
        run: |
          if [ -n "${RELAIS_TEST_REDIS_CLUSTER_ADDRS}" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

  cluster-tests:
    needs: cluster-tests-gate
    if: ${{ needs.cluster-tests-gate.outputs.should_run == 'true' }}
    env:
      RELAIS_TEST_REDIS_CLUSTER_ADDRS: ${{ secrets.RELAIS_TEST_REDIS_CLUSTER_ADDRS }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Install dependencies
        run: make deps

      - name: Run Redis Cluster tests
        run: make test-cluster