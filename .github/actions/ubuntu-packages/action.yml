name: Ubuntu packages
description: Cache authenticated Ubuntu packages and install with bounded mirror retries
inputs:
  packages:
    description: Space-separated Ubuntu package names
    required: true
outputs:
  key:
    description: Cache identity for this runner image and package set
    value: ${{ steps.package-cache-key.outputs.key }}
runs:
  using: composite
  steps:
    - name: Compute Ubuntu package cache key
      id: package-cache-key
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        read -r -a packages <<< "$PACKAGES"
        python3 scripts/ci/install-packages.py key "${packages[@]}"
    - name: Cache authenticated Ubuntu packages
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
      with:
        path: ${{ runner.temp }}/relais-apt
        key: ${{ steps.package-cache-key.outputs.key }}
    - name: Install Ubuntu packages
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        read -r -a packages <<< "$PACKAGES"
        python3 scripts/ci/install-packages.py install "${packages[@]}"
