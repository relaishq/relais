        /etc/relais/node.json:
          content:
            Fn::Sub:
            - '{"region": "${v0}", "version": "${v1}", "architecture": "${v2}", "sha256": "${v3}", "ssm": "${v4}", "components":
              ["signal"], "secrets": {"token": "${v5}"}}'
            - v0:
                Ref: AWS::Region
              v1:
                Ref: ReleaseVersion
              v2:
                Ref: Architecture
              v3:
                Ref: ArchiveSHA256
              v4:
                Fn::If:
                - SessionManager
                - 'true'
                - 'false'
              v5:
                Ref: SignalToken
          mode: '000600'
        /etc/relais/node.env:
          content:
            Fn::Sub:
            - |
              RELAIS_REDIS_ADDR=${Store.ConfigurationEndPoint.Address}:${Store.ConfigurationEndPoint.Port}
              RELAIS_REDIS_CLUSTER=1
              RELAIS_REDIS_TLS=1
              RELAIS_REDIS_PREFIX=relais:preview:
              RELAIS_PRIVATE_NETS=10.42.0.0/16
              RELAY_PRIVATE=10.42.0.10
              RELAY_PUBLIC=${RelayAddress}
              CONTROL_PRIVATE=10.42.10.20
              WORKER_ONE=10.42.10.11
              WORKER_TWO=10.42.11.12
              WORKER_THREE=${ThirdWorker}
              WORKER_CALL_CAP=${WorkerCallCap}
              NODE_PRIVATE=10.42.11.21
              WORKER_NAME=
            - ThirdWorker:
                Fn::If:
                - Resilience
                - 10.42.10.13
                - ''
          mode: '000644'
    DependsOn:
    - PrivateDefaultB
    Condition: Resilience
  RelayAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId:
        Fn::GetAtt:
        - RelayAddress
        - AllocationId
      NetworkInterfaceId:
        Ref: RelayInterface
  RelayInterface:
    Type: AWS::EC2::NetworkInterface
    Properties:
      SubnetId:
        Ref: PublicA
      PrivateIpAddress: 10.42.0.10
      GroupSet:
      - Ref: RelayGroup
  SignalAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      Subnets:
      - Ref: PublicA
      - Ref: PublicB
      SecurityGroups:
      - Ref: AlbGroup
      LoadBalancerAttributes:
      - Key: routing.http.drop_invalid_header_fields.enabled
        Value: 'true'
    DependsOn: InternetAttachment
  SignalTargets:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId:
        Ref: Vpc
      Protocol: HTTPS
      Port: 24743
      TargetType: instance
      Targets:
      - Id:
          Fn::If:
          - Lean
          - Ref: SharedHost
          - Ref: SignalHost
      HealthCheckProtocol: HTTPS
      HealthCheckPath: /status
      Matcher:
        HttpCode: '401'
      TargetGroupAttributes:
      - Key: deregistration_delay.timeout_seconds
        Value: '15'
  SignalListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn:
        Ref: SignalAlb
      Protocol: HTTPS
      Port: 443
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
      - CertificateArn:
          Ref: CertificateArn
      DefaultActions:
      - Type: fixed-response
        FixedResponseConfig:
          StatusCode: '404'
          ContentType: text/plain
          MessageBody: Not found
  SignalRoutes:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn:
        Ref: SignalListener
      Priority: 1
      Conditions:
      - Field: path-pattern
        Values:
        - /calls
        - /calls/*
        - /status
        - /clock
      Actions:
      - Type: forward
        TargetGroupArn:
          Ref: SignalTargets
  SignalWaf:
    Type: AWS::WAFv2::WebACL
    Properties:
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: RelaisSignal
        SampledRequestsEnabled: false
      Rules:
      - Name: ClientRate
        Priority: 0
        Action:
          Block: {}
        Statement:
          RateBasedStatement:
            Limit:
              Ref: SignalRateLimit
            AggregateKeyType: IP
            EvaluationWindowSec: 300
        VisibilityConfig:
          CloudWatchMetricsEnabled: true
          MetricName: RelaisSignalRate
          SampledRequestsEnabled: false
  SignalWafAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn:
        Ref: SignalAlb
      WebACLArn:
        Fn::GetAtt:
        - SignalWaf
        - Arn
Outputs:
  RelayIPv4:
    Value:
      Ref: RelayAddress
  SignalLoadBalancer:
    Value:
      Fn::GetAtt:
      - SignalAlb
      - DNSName
  StoreConfigurationEndpoint:
    Value:
      Fn::GetAtt:
      - Store
      - ConfigurationEndPoint.Address
    Description: Public configuration only; this endpoint is private and uses TLS/Cluster discovery.
