# Native CloudFormation; boot copies are maintained by tests/sync-files.py --write.
AWSTemplateFormatVersion: '2010-09-09'
Description: Relais fixed preview. No public-use readiness claim; control restart safety and AWS acceptance remain pending.
Parameters:
  Profile:
    Type: String
    Default: lean
    AllowedValues:
    - lean
    - resilience
  ReleaseVersion:
    Type: String
    AllowedPattern: 0\.2\.[1-9][0-9]*|0\.([3-9]|[1-9][0-9]+)\.[0-9]+|[1-9][0-9]*\.[0-9]+\.[0-9]+
    Description: Required post-v0.2.0 release version without v; no release is selected for you.
  ArchiveSHA256:
    Type: String
    AllowedPattern: '[a-f0-9]{64}'
    Description: Independently verified SHA-256 for the selected Linux architecture archive.
  Architecture:
    Type: String
    Default: arm64
    AllowedValues:
    - arm64
    - x86_64
  ArmInstanceType:
    Type: String
    Default: m7g.large
    AllowedPattern: '[a-z0-9]+[.][a-z0-9]+'
  X86InstanceType:
    Type: String
    Default: m7i.large
    AllowedPattern: '[a-z0-9]+[.][a-z0-9]+'
  CertificateArn:
    Type: String
    AllowedPattern: arn:[a-z-]+:acm:[a-z0-9-]+:[0-9]{12}:certificate/[a-f0-9-]+
    Description: Your ACM certificate ARN in this region. Configure your DNS name after creation.
  EnableSessionManager:
    Type: String
    Default: 'false'
    AllowedValues:
    - 'false'
    - 'true'
  WorkerCallCap:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 8
    Description: Admission limit, not an EC2 capacity claim; validate your workload before increasing.
  SignalRateLimit:
    Type: Number
    Default: 100
    MinValue: 10
    Description: WAF requests per client IP per five-minute window; shared-NAT clients share a limit.
  ImageId:
    Type: AWS::EC2::Image::Id
    Description: Required reviewed standard AL2023 AMI, matching Architecture; no automatic alias updates.
Conditions:
  Lean:
    Fn::Equals:
    - Ref: Profile
    - lean
  Resilience:
    Fn::Equals:
    - Ref: Profile
    - resilience
  Arm:
    Fn::Equals:
    - Ref: Architecture
    - arm64
  SessionManager:
    Fn::Equals:
    - Ref: EnableSessionManager
    - 'true'
Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties: {}
  InternetAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId:
        Ref: Vpc
      InternetGatewayId:
        Ref: InternetGateway
  PublicA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: Vpc
      AvailabilityZone:
        Fn::Select:
        - 0
        - Fn::GetAZs: ''
      CidrBlock: 10.42.0.0/24
      MapPublicIpOnLaunch: false
  PrivateA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: Vpc
      AvailabilityZone:
        Fn::Select:
        - 0
        - Fn::GetAZs: ''
      CidrBlock: 10.42.10.0/24
      MapPublicIpOnLaunch: false
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
  PrivateRouteA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId:
        Ref: Vpc
  PrivateAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: PrivateA
      RouteTableId:
        Ref: PrivateRouteA
  PublicB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: Vpc
      AvailabilityZone:
        Fn::Select:
        - 1
        - Fn::GetAZs: ''
      CidrBlock: 10.42.1.0/24
      MapPublicIpOnLaunch: false
  PrivateB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: Vpc
      AvailabilityZone:
        Fn::Select:
        - 1
        - Fn::GetAZs: ''
      CidrBlock: 10.42.11.0/24
      MapPublicIpOnLaunch: false
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
  PrivateRouteB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId:
        Ref: Vpc
  PrivateAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: PrivateB
      RouteTableId:
        Ref: PrivateRouteB
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId:
        Ref: Vpc
  InternetRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId:
        Ref: PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId:
        Ref: InternetGateway
    DependsOn: InternetAttachment
  PublicAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: PublicA
      RouteTableId:
        Ref: PublicRouteTable
  PublicAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: PublicB
      RouteTableId:
        Ref: PublicRouteTable
  NatAddressA:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
  NatA:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId:
        Fn::GetAtt:
        - NatAddressA
        - AllocationId
      SubnetId:
        Ref: PublicA
    DependsOn:
    - InternetAttachment
    - RelayAddressReservation
    - WorkerOneReservation
    - WorkerTwoReservation
    - WorkerThreeReservation
    - ControlAddressReservation
    - SignalAddressReservation
  PrivateDefaultA:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId:
        Ref: PrivateRouteA
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId:
        Ref: NatA
  NatAddressB:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
    Condition: Resilience
  NatB:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId:
        Fn::GetAtt:
        - NatAddressB
        - AllocationId
      SubnetId:
        Ref: PublicB
    DependsOn:
    - InternetAttachment
    - RelayAddressReservation
    - WorkerOneReservation
    - WorkerTwoReservation
    - WorkerThreeReservation
    - ControlAddressReservation
    - SignalAddressReservation
    Condition: Resilience
  PrivateDefaultB:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId:
        Ref: PrivateRouteB
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId:
        Fn::If:
        - Resilience
        - Ref: NatB
        - Ref: NatA
  RelayGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Relais Relay component
      VpcId:
        Ref: Vpc
      SecurityGroupEgress:
      - IpProtocol: icmp
        FromPort: 252
        ToPort: 86
        CidrIp: 127.0.0.1/32
        Description: Unusable rule suppresses the default allow-all egress
  WorkerGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Relais Worker component
      VpcId:
        Ref: Vpc
      SecurityGroupEgress:
      - IpProtocol: icmp
        FromPort: 252
        ToPort: 86
        CidrIp: 127.0.0.1/32
        Description: Unusable rule suppresses the default allow-all egress
  ControlGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Relais Control component
      VpcId:
        Ref: Vpc
      SecurityGroupEgress:
      - IpProtocol: icmp
        FromPort: 252
        ToPort: 86
        CidrIp: 127.0.0.1/32
        Description: Unusable rule suppresses the default allow-all egress
  SignalGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Relais Signal component
      VpcId:
        Ref: Vpc
      SecurityGroupEgress:
      - IpProtocol: icmp
        FromPort: 252
        ToPort: 86
        CidrIp: 127.0.0.1/32
        Description: Unusable rule suppresses the default allow-all egress
  AlbGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Relais Alb component
      VpcId:
        Ref: Vpc
      SecurityGroupEgress:
      - IpProtocol: icmp
        FromPort: 252
        ToPort: 86
        CidrIp: 127.0.0.1/32
        Description: Unusable rule suppresses the default allow-all egress
  StoreGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Relais Store component
      VpcId:
        Ref: Vpc
      SecurityGroupEgress:
      - IpProtocol: icmp
        FromPort: 252
        ToPort: 86
        CidrIp: 127.0.0.1/32
        Description: Unusable rule suppresses the default allow-all egress
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
  WorkerRelayLegIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Ref: RelayGroup
      SourceSecurityGroupId:
        Ref: WorkerGroup
      IpProtocol: udp
      FromPort: 24781
      ToPort: 24781
  WorkerRelayLegEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId:
        Ref: WorkerGroup
      DestinationSecurityGroupId:
        Ref: RelayGroup
      IpProtocol: udp
      FromPort: 24781
      ToPort: 24781
  RelayWorkerMediaIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Ref: WorkerGroup
      SourceSecurityGroupId:
        Ref: RelayGroup
      IpProtocol: udp
      FromPort: 24711
      ToPort: 24711
  RelayWorkerMediaEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId:
        Ref: RelayGroup
      DestinationSecurityGroupId:
        Ref: WorkerGroup
      IpProtocol: udp
      FromPort: 24711
      ToPort: 24711
  ControlWorkerApiIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Ref: WorkerGroup
      SourceSecurityGroupId:
        Ref: ControlGroup
      IpProtocol: tcp
      FromPort: 24701
      ToPort: 24701
  ControlWorkerApiEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId:
        Ref: ControlGroup
      DestinationSecurityGroupId:
        Ref: WorkerGroup
      IpProtocol: tcp
      FromPort: 24701
      ToPort: 24701
  WorkerControlApiIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Ref: ControlGroup
      SourceSecurityGroupId:
        Ref: WorkerGroup
      IpProtocol: tcp
      FromPort: 24710
      ToPort: 24710
  WorkerControlApiEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId:
        Ref: WorkerGroup
      DestinationSecurityGroupId:
        Ref: ControlGroup
      IpProtocol: tcp
      FromPort: 24710
      ToPort: 24710
  ControlRelayApiIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Ref: RelayGroup
      SourceSecurityGroupId:
        Ref: ControlGroup
      IpProtocol: tcp
      FromPort: 24700
      ToPort: 24700
  ControlRelayApiEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId:
        Ref: ControlGroup
      DestinationSecurityGroupId:
        Ref: RelayGroup
      IpProtocol: tcp
      FromPort: 24700
      ToPort: 24700
  SignalControlApiIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Ref: ControlGroup
      SourceSecurityGroupId:
        Ref: SignalGroup
      IpProtocol: tcp
      FromPort: 24710
      ToPort: 24710
  SignalControlApiEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId:
        Ref: SignalGroup
      DestinationSecurityGroupId:
        Ref: ControlGroup
      IpProtocol: tcp
      FromPort: 24710
      ToPort: 24710
  AlbSignalHttpsIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Ref: SignalGroup
      SourceSecurityGroupId:
        Ref: AlbGroup
      IpProtocol: tcp
      FromPort: 24743
      ToPort: 24743
  AlbSignalHttpsEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId:
        Ref: AlbGroup
      DestinationSecurityGroupId:
        Ref: SignalGroup
      IpProtocol: tcp
      FromPort: 24743
      ToPort: 24743
  WorkerStoreIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Ref: StoreGroup
      SourceSecurityGroupId:
        Ref: WorkerGroup
      IpProtocol: tcp
      FromPort: 6379
      ToPort: 6379
  WorkerStoreEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId:
        Ref: WorkerGroup
      DestinationSecurityGroupId:
        Ref: StoreGroup
      IpProtocol: tcp
      FromPort: 6379
      ToPort: 6379
  ControlStoreIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Ref: StoreGroup
      SourceSecurityGroupId:
        Ref: ControlGroup
      IpProtocol: tcp
      FromPort: 6379
      ToPort: 6379
  ControlStoreEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId:
        Ref: ControlGroup
      DestinationSecurityGroupId:
        Ref: StoreGroup
      IpProtocol: tcp
      FromPort: 6379
      ToPort: 6379
  RelayStoreIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Ref: StoreGroup
      SourceSecurityGroupId:
        Ref: RelayGroup
      IpProtocol: tcp
      FromPort: 6379
      ToPort: 6379
  RelayStoreEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId:
        Ref: RelayGroup
      DestinationSecurityGroupId:
        Ref: StoreGroup
      IpProtocol: tcp
      FromPort: 6379
      ToPort: 6379
  RelayInternetEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId:
        Ref: RelayGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0
      Description: Artifacts, Secrets Manager, optional SSM, OS packages and provider HTTPS APIs
  WorkerInternetEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId:
        Ref: WorkerGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0
      Description: Artifacts, Secrets Manager, optional SSM, OS packages and provider HTTPS APIs
  ControlInternetEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId:
        Ref: ControlGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0
      Description: Artifacts, Secrets Manager, optional SSM, OS packages and provider HTTPS APIs
  SignalInternetEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId:
        Ref: SignalGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0
      Description: Artifacts, Secrets Manager, optional SSM, OS packages and provider HTTPS APIs
  PublicRelay:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Ref: RelayGroup
      IpProtocol: udp
      FromPort: 24780
      ToPort: 24780
      CidrIp: 0.0.0.0/0
  PublicHttps:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Ref: AlbGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0
  SnapshotKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Relais preview generated SnapshotKey
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
        IncludeSpace: false
        RequireEachIncludedType: false
        ExcludeUppercase: true
        ExcludeCharacters: ghijklmnopqrstuvwxyz
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
  SignalToken:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Relais preview generated SignalToken
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
        IncludeSpace: false
        RequireEachIncludedType: false
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
  RelayPassword:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Relais preview generated RelayPassword
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
        IncludeSpace: false
        RequireEachIncludedType: false
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
  WorkerPassword:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Relais preview generated WorkerPassword
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
        IncludeSpace: false
        RequireEachIncludedType: false
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
  ControlPassword:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Relais preview generated ControlPassword
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
        IncludeSpace: false
        RequireEachIncludedType: false
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
  RelayStoreUser:
    Type: AWS::ElastiCache::User
    Properties:
      Engine: valkey
      UserId:
        Fn::Sub: ${AWS::StackName}-relay
      UserName: relay
      AccessString: on -@all +ping +cluster|slots +command +time +scan (+eval +evalsha ~relais:preview:lease:* ~relais:preview:state:*
        ~relais:preview:record:* ~relais:preview:epoch:* ~relais:preview:routes:* ~relais:preview:ended:* ~relais:preview:setup:*
        ~relais:preview:checkpoint:* ~relais:preview:work:* ~relais:preview:history:* ~relais:preview:relay:*) (+hmget ~relais:preview:lease:*
        ~relais:preview:ended:* ~relais:preview:relay:*) (+hget ~relais:preview:lease:* ~relais:preview:routes:* ~relais:preview:relay:*)
        (+hgetall +pttl +hdel +pexpireat ~relais:preview:routes:*) (+hset ~relais:preview:routes:* ~relais:preview:relay:*)
        (+hincrby ~relais:preview:relay:*) (+del ~relais:preview:state:* ~relais:preview:record:* ~relais:preview:routes:*
        ~relais:preview:setup:* ~relais:preview:checkpoint:* ~relais:preview:work:* ~relais:preview:history:*)
      AuthenticationMode:
        Type: password
        Passwords:
        - Fn::Sub: '{{resolve:secretsmanager:${RelayPassword}:SecretString}}'
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
  WorkerStoreUser:
    Type: AWS::ElastiCache::User
    Properties:
      Engine: valkey
      UserId:
        Fn::Sub: ${AWS::StackName}-worker
      UserName: worker
      AccessString: on -@all +ping +cluster|slots +command +eval +evalsha +script|load +time +hmget +hget +hgetall +hset +hincrby
        +hdel +get +set +del +exists +incr +pttl +pexpire +pexpireat +zadd +zrange +zrem +scan ~relais:preview:* +type +hexists
      AuthenticationMode:
        Type: password
        Passwords:
        - Fn::Sub: '{{resolve:secretsmanager:${WorkerPassword}:SecretString}}'
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
  ControlStoreUser:
    Type: AWS::ElastiCache::User
    Properties:
      Engine: valkey
      UserId:
        Fn::Sub: ${AWS::StackName}-control
      UserName: control
      AccessString: on -@all +ping +cluster|slots +command +eval +evalsha +script|load +time +hmget +hget +hgetall +hset +hincrby
        +hdel +get +set +del +exists +incr +pttl +pexpire +pexpireat +zadd +zrange +zrem +scan ~relais:preview:* +type +hexists +hlen
      AuthenticationMode:
        Type: password
        Passwords:
        - Fn::Sub: '{{resolve:secretsmanager:${ControlPassword}:SecretString}}'
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
  StoreUsers:
    Type: AWS::ElastiCache::UserGroup
    Properties:
      Engine: valkey
      UserGroupId:
        Fn::Sub: ${AWS::StackName}-users
      UserIds:
      - Ref: RelayStoreUser
      - Ref: WorkerStoreUser
      - Ref: ControlStoreUser
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
  StoreSubnets:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: Relais durable store in two AZs
      SubnetIds:
      - Ref: PrivateA
      - Ref: PrivateB
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
  Store:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupDescription: Relais preview synchronous ownership store
      Engine: valkey
      EngineVersion: '9.0'
      CacheNodeType: cache.m7g.large
      ClusterMode: enabled
      NumNodeGroups: 1
      ReplicasPerNodeGroup: 1
      AutomaticFailoverEnabled: true
      MultiAZEnabled: true
      Durability: sync
      AtRestEncryptionEnabled: true
      TransitEncryptionEnabled: true
      TransitEncryptionMode: required
      CacheSubnetGroupName:
        Ref: StoreSubnets
      SecurityGroupIds:
      - Ref: StoreGroup
      UserGroupIds:
      - Ref: StoreUsers
      NodeGroupConfiguration:
      - NodeGroupId: '0001'
        PrimaryAvailabilityZone:
          Fn::Select:
          - 0
          - Fn::GetAZs: ''
        ReplicaAvailabilityZones:
        - Fn::Select:
          - 1
          - Fn::GetAZs: ''
        ReplicaCount: 1
      SnapshotRetentionLimit: 1
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    DependsOn:
    - RelayAddressReservation
    - WorkerOneReservation
    - WorkerTwoReservation
    - WorkerThreeReservation
    - ControlAddressReservation
    - SignalAddressReservation
  RelayAddress:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
    DependsOn: InternetAttachment
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
  RelayRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ec2.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: BootOnly
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - secretsmanager:GetSecretValue
            Resource:
            - Ref: RelayPassword
          - Effect: Allow
            Action:
            - cloudformation:DescribeStackResource
            Resource:
              Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*
          - Effect: Allow
            Action:
            - cloudformation:SignalResource
            Resource:
              Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*
          - Fn::If:
            - SessionManager
            - Effect: Allow
              Action:
              - ssmmessages:CreateControlChannel
              - ssmmessages:CreateDataChannel
              - ssmmessages:OpenControlChannel
              - ssmmessages:OpenDataChannel
              Resource: '*'
            - Ref: AWS::NoValue
          - Fn::If:
            - SessionManager
            - Effect: Allow
              Action:
              - ssm:UpdateInstanceInformation
              Resource:
                Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
              Condition:
                StringEquals:
                  aws:ResourceTag/RelaisRole: relay
                  aws:ResourceTag/RelaisStack:
                    Ref: AWS::StackName
            - Ref: AWS::NoValue
      RoleName:
        Fn::Sub: ${AWS::StackName}-relay
  RelayInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
      - Ref: RelayRole
  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ec2.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: BootOnly
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - secretsmanager:GetSecretValue
            Resource:
            - Ref: WorkerPassword
            - Ref: SnapshotKey
          - Effect: Allow
            Action:
            - cloudformation:DescribeStackResource
            Resource:
              Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*
          - Effect: Allow
            Action:
            - cloudformation:SignalResource
            Resource:
              Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*
          - Fn::If:
            - SessionManager
            - Effect: Allow
              Action:
              - ssmmessages:CreateControlChannel
              - ssmmessages:CreateDataChannel
              - ssmmessages:OpenControlChannel
              - ssmmessages:OpenDataChannel
              Resource: '*'
            - Ref: AWS::NoValue
          - Fn::If:
            - SessionManager
