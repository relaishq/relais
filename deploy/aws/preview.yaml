  BootFiles:
    Type: AWS::CloudFormation::WaitConditionHandle
    Metadata:
      RelaisFiles:
        /opt/relais/boot/download.sh:
          content: |
            #!/usr/bin/env bash
            # Install only a caller-pinned archive. Never execute unverified bytes.
            set -euo pipefail
            umask 077
            [[ $# == 5 ]] || { echo 'usage: download.sh VERSION arm64|x86_64 SHA256 DEST COMPONENTS' >&2; exit 2; }
            version=$1 arch=$2 digest=$3 dest=$4 components=$5
            [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+([.+-][A-Za-z0-9.+-]+)?$ ]] || exit 2
            [[ $digest =~ ^[a-f0-9]{64}$ ]] || exit 2
            case $arch in arm64) ;; x86_64) arch=amd64 ;; *) exit 2 ;; esac
            base="relais_${version}_linux_${arch}"
            url="https://github.com/relaishq/relais/releases/download/v${version}/${base}.tar.gz"
            # Local test seam; the stack never sets this variable.
            url=${RELAIS_TEST_ARCHIVE_URL:-$url}
            work=$(mktemp -d)
            trap 'rm -rf "$work"' EXIT
            curl --fail --silent --show-error --location --retry 3 --output "$work/archive" "$url"
            if command -v sha256sum >/dev/null 2>&1; then
              actual=$(sha256sum "$work/archive")
            else
              actual=$(shasum -a 256 "$work/archive")
            fi
            [[ ${actual%% *} == "$digest" ]] || { echo 'artifact digest mismatch; installation refused' >&2; exit 1; }
            # Reject traversal, links, devices and unexpected members before extraction.
            python3 - "$work/archive" "$base" "$work" <<'PY'
            import sys, tarfile
            archive, base, work = sys.argv[1:]
            allowed = {'relais-relay', 'relais-worker', 'relais-control', 'relais-signal',
                       'relais-demo', 'relais-load', 'relais-compat', 'compatibility.json', 'start.sh', 'stop.sh', 'LICENSE', 'NOTICE', 'README.md'}
            with tarfile.open(archive, 'r:gz') as tar:
                found = set()
                for member in tar.getmembers():
                    name = member.name.rstrip('/')
                    if name == base and member.isdir():
                        continue
                    if not member.isfile() or name not in {base + '/' + n for n in allowed} or name in found:
                        raise SystemExit('unsafe archive; installation refused')
                    found.add(name)
                if found != {base + '/' + n for n in allowed}:
                    raise SystemExit('incomplete archive; compatibility manifest required')
                tar.extractall(work)
            PY
            "$work/$base/relais-compat" artifact --manifest "$work/$base/compatibility.json" \
              --version "$version" --os linux --arch "$arch" --binary-dir "$work/$base"
            install -d -m 0755 "$dest"
            install -m 0644 "$work/$base/compatibility.json" "$dest/compatibility.json"
            install -m 0755 "$work/$base/relais-compat" "$dest/relais-compat"
            for component in $components; do
              case $component in relay|worker|control|signal) ;; *) exit 2 ;; esac
              install -m 0755 "$work/$base/relais-$component" "$dest/relais-$component"
            done
            echo 'artifact verified and installed'
          mode: '000755'
        /opt/relais/boot/install.sh:
          content: |
            #!/usr/bin/env bash
            # Root-only, fail-closed initial boot. Services do not refresh credentials themselves.
            set -euo pipefail
            umask 077
            root=${RELAIS_INSTALL_ROOT:-/}
            boot="$root/opt/relais/boot"
            config="$root/etc/relais/node.json"
            # Public executable directories must remain traversable after systemd drops root.
            install -d -m 0755 "$root/opt/relais" "$boot" "$root/opt/relais/bin"
            # A single failure prevents any component from starting.
            settings=()
            while IFS= read -r value; do settings+=("$value"); done < <(python3 - "$config" <<'PY'
            import json, sys
            c = json.load(open(sys.argv[1]))
            print(c['version']); print(c['architecture']); print(c['sha256'])
            print(' '.join(c['components'])); print(c['ssm'])
            PY
            )
            "$boot/download.sh" "${settings[0]}" "${settings[1]}" "${settings[2]}" "$root/opt/relais/bin" "${settings[3]}"
            python3 "$boot/prepare.py" "$config" "$root/run/relais"
            "${RELAIS_TEST_SYSCTL:-sysctl}" -p "$root/etc/sysctl.d/60-relais-udp.conf"
            manager=${RELAIS_TEST_SYSTEMCTL:-systemctl}
            if [[ ${settings[4]} == false ]]; then
              "$manager" disable --now amazon-ssm-agent.service
              "$manager" mask amazon-ssm-agent.service
            else
              "$manager" enable --now amazon-ssm-agent.service
            fi
            for component in ${settings[3]}; do
              if [[ -z ${RELAIS_INSTALL_ROOT:-} ]]; then
                id "relais-$component" >/dev/null 2>&1 || useradd --system --user-group --no-create-home --shell /usr/sbin/nologin "relais-$component"
              fi
            done
            "$manager" daemon-reload
            for component in ${settings[3]}; do
              "$manager" enable --now "relais-$component.service"
              if [[ $component == relay ]]; then "$manager" enable --now relais-relay-standby.service; fi
            done
            for component in ${settings[3]}; do
              "$manager" is-active --quiet "relais-$component.service"
              if [[ $component == relay ]]; then "$manager" is-active --quiet relais-relay-standby.service; fi
            done
            if [[ -n ${RELAIS_TEST_READY:-} ]]; then
              "$RELAIS_TEST_READY" readiness
            else
              python3 "$boot/ready.py" "$config" "$root/etc/relais/node.env"
            fi
            echo 'boot services started and ready'
          mode: '000755'
        /opt/relais/boot/load.py:
          content: |
            #!/usr/bin/env python3
            """Materialize reviewed public metadata; credential values are fetched separately."""
            import json
            from pathlib import Path
            import sys

            root = Path(sys.argv[1])
            common = json.loads((root / 'etc/relais/common.json').read_text())['RelaisFiles']
            host = json.loads((root / 'etc/relais/host.json').read_text())['RelaisFiles']
            assert set(host) == {'/etc/relais/node.json', '/etc/relais/node.env'}
            components = json.loads(host['/etc/relais/node.json']['content'])['components']
            units = {'relais-prepare.service', *('relais-' + c + '.service' for c in components)}
            if 'relay' in components:
                units.add('relais-relay-standby.service')
            for name, entry in {**common, **host}.items():
                if name.startswith('/etc/systemd/system/') and Path(name).name not in units:
                    continue
                path = root / name.lstrip('/')
                if not path.parent.exists():
                    path.parent.mkdir(parents=True, mode=0o755)
                path.write_text(entry['content'])
                path.chmod(int(entry['mode'], 8))
          mode: '000755'
        /opt/relais/boot/prepare.py:
          content: |
            #!/usr/bin/env python3
            """Fetch exact secret references; never print a secret or a CLI exception."""
            import json
            import os
            from pathlib import Path
            import re
            import sys
            import subprocess


            def prepare(config_path, runtime):
                config = json.loads(Path(config_path).read_text())
                root = Path(runtime)
                root.mkdir(mode=0o700, parents=True, exist_ok=True)
                os.chmod(root, 0o700)
                if os.environ.get('RELAIS_TEST_SECRET_FILE'):
                    values = json.loads(Path(os.environ['RELAIS_TEST_SECRET_FILE']).read_text())
                    fetch = values.__getitem__
                else:
                    def fetch(arn):
                        result = subprocess.run(['aws', 'secretsmanager', 'get-secret-value', '--secret-id', arn,
                                                 '--region', config['region'], '--query', 'SecretString', '--output', 'text'],
                                                capture_output=True, text=True, check=True)
                        return result.stdout.rstrip('\n')

                def write(name, value):
                    path = root / name
                    # Refuse symlinks. Runtime directory is root-only in the real boot path.
                    fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC | os.O_NOFOLLOW, 0o600)
                    try:
                        os.fchmod(fd, 0o600)
                        with os.fdopen(fd, 'w') as stream:
                            stream.write(value)
                    except BaseException:
                        path.unlink(missing_ok=True)
                        raise

                def secret(arn, pattern):
                    value = fetch(arn)
                    if not re.fullmatch(pattern, value):
                        raise ValueError('invalid generated secret')
                    return value

                # Remove old values before a failed refresh can leave stale credentials usable.
                for role in config['components']:
                    (root / (role + '.env')).unlink(missing_ok=True)
                (root / 'signal.token').unlink(missing_ok=True)
                for role in config['components']:
                    if role == 'signal':
                        write('signal.token', secret(config['secrets']['token'], r'[A-Za-z0-9]{64}'))
                        continue
                    entries = {
                        'RELAIS_REDIS_USERNAME': role,
                        'RELAIS_REDIS_PASSWORD': secret(config['secrets'][role], r'[A-Za-z0-9]{64}'),
                    }
                    if role in ('worker', 'control'):
                        entries['RELAIS_SESSIONSTORE_KEY'] = secret(config['secrets']['snapshot'], r'[0-9a-f]{64}')
                    write(role + '.env', ''.join(f'{key}={value}\n' for key, value in entries.items()))


            if __name__ == '__main__':
                try:
                    prepare(sys.argv[1], sys.argv[2])
                except Exception:
                    print('secret preparation failed; start refused', file=sys.stderr)
                    sys.exit(1)
