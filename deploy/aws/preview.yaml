                  -relay-media "$RELAY_PUBLIC:${RELAY_MEDIA_PORT:-24780}" -control "http://$CONTROL_PRIVATE:${CONTROL_HTTP_PORT:-24710}" -agent echo
                ;;
              control)
                workers=(-worker "w1=http://$WORKER_ONE:${WORKER_ONE_PORT:-24701}" -worker "w2=http://$WORKER_TWO:${WORKER_TWO_PORT:-24701}")
                [[ -z ${WORKER_THREE:-} ]] || workers+=(-worker "w3=http://$WORKER_THREE:${WORKER_THREE_PORT:-24701}")
                exec "$bin/relais-control" -http "$CONTROL_PRIVATE:${CONTROL_HTTP_PORT:-24710}" -relay "http://$RELAY_PRIVATE:${RELAY_HTTP_PORT:-24700}" \
                  -worker-call-cap "$WORKER_CALL_CAP" "${workers[@]}"
                ;;
              signal)
                exec "$bin/relais-signal" -listen "$NODE_PRIVATE:${SIGNAL_PORT:-24743}" \
                  -control "http://$CONTROL_PRIVATE:${CONTROL_HTTP_PORT:-24710}" -advertise-ips "$NODE_PRIVATE" \
                  -token-file "${CREDENTIALS_DIRECTORY:?}/signal.token"
                ;;
              *) echo 'unknown component; start refused' >&2; exit 2 ;;
            esac
          mode: '000755'
        /etc/systemd/system/relais-control.service:
          content: |
            [Unit]
            Description=Relais preview control
            After=network-online.target relais-prepare.service
            Wants=network-online.target
            Requires=relais-prepare.service

            [Service]
            Type=simple
            User=relais-control
            Group=relais-control
            EnvironmentFile=/etc/relais/node.env
            EnvironmentFile=/run/relais/control.env
            ExecStart=/opt/relais/boot/run.sh control
            Restart=no
            TimeoutStopSec=15s
            UMask=0077
            NoNewPrivileges=yes
            ProtectSystem=strict
            ProtectHome=yes
            PrivateTmp=yes
            RestrictSUIDSGID=yes
            LockPersonality=yes
            RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
            CapabilityBoundingSet=
            IPAddressDeny=169.254.169.254/32
            StandardOutput=journal
            StandardError=journal

            [Install]
            WantedBy=multi-user.target
          mode: '000644'
        /etc/systemd/system/relais-prepare.service:
          content: |
            [Unit]
            Description=Relais boot credentials
            After=network-online.target
