        /opt/relais/boot/ready.py:
          content: |
            #!/usr/bin/env python3
            """Bound boot success on local component readiness, without credential requests."""
            import json
            from pathlib import Path
            import ssl
            import sys
            import time
            import urllib.error
            import urllib.request


            def ready(config_path, env_path, timeout=180):
                components = json.loads(Path(config_path).read_text())['components']
                settings = dict(line.split('=', 1) for line in Path(env_path).read_text().splitlines() if line and not line.startswith('#'))
                ports = {'relay': ('RELAY_HTTP_PORT', 24700), 'worker': ('WORKER_HTTP_PORT', 24701),
                         'control': ('CONTROL_HTTP_PORT', 24710), 'signal': ('SIGNAL_PORT', 24743)}
                deadline = time.monotonic() + timeout
                for role in components:
                    address = settings['RELAY_PRIVATE' if role == 'relay' else 'CONTROL_PRIVATE' if role == 'control' else 'NODE_PRIVATE']
                    key, default = ports[role]
                    url = ('https' if role == 'signal' else 'http') + '://' + address + ':' + settings.get(key, str(default)) + '/status'
                    while time.monotonic() < deadline:
                        try:
                            with urllib.request.urlopen(url, timeout=2, context=ssl._create_unverified_context()) as response:
                                data = json.load(response)
                                if role != 'control' or data.get('ready') is True:
                                    break
                        except urllib.error.HTTPError as exc:
                            if role == 'signal' and exc.code == 401:
                                break
                        except (OSError, ValueError):
                            pass
                        time.sleep(0.2)
                    else:
                        raise RuntimeError('component readiness failed: ' + role)


            if __name__ == '__main__':
                try:
                    ready(sys.argv[1], sys.argv[2])
                except Exception:
                    print('component readiness failed; boot refused', file=sys.stderr)
                    sys.exit(1)
                print('local components ready')
          mode: '000755'
        /opt/relais/boot/run.sh:
          content: |
            #!/usr/bin/env bash
            # systemd supplies non-secret node settings and a separate role EnvironmentFile.
            set -euo pipefail
            bin=${RELAIS_BIN_DIR:-/opt/relais/bin}
            case ${1:-} in
              relay|relay-standby)
                unset RELAIS_SESSIONSTORE_KEY
                standby=()
                [[ $1 == relay ]] || standby=(-standby)
                exec "$bin/relais-relay" -media "$RELAY_PRIVATE:${RELAY_MEDIA_PORT:-24780}" -leg "$RELAY_PRIVATE:${RELAY_LEG_PORT:-24781}" \
                  -http "$RELAY_PRIVATE:${RELAY_HTTP_PORT:-24700}" -relay-lease preview "${standby[@]}"
                ;;
              worker)
                exec "$bin/relais-worker" -name "$WORKER_NAME" -media "$NODE_PRIVATE:${WORKER_MEDIA_PORT:-24711}" \
                  -http "$NODE_PRIVATE:${WORKER_HTTP_PORT:-24701}" -relay-leg "$RELAY_PRIVATE:${RELAY_LEG_PORT:-24781}" \
                  -relay-media "$RELAY_PUBLIC:${RELAY_MEDIA_PORT:-24780}" -control "http://$CONTROL_PRIVATE:${CONTROL_HTTP_PORT:-24710}" -agent echo
                ;;
              control)
                workers=(-worker "w1=http://$WORKER_ONE:${WORKER_ONE_PORT:-24701}" -worker "w2=http://$WORKER_TWO:${WORKER_TWO_PORT:-24701}")
                [[ -z ${WORKER_THREE:-} ]] || workers+=(-worker "w3=http://$WORKER_THREE:${WORKER_THREE_PORT:-24701}")
                exec "$bin/relais-control" -http "$CONTROL_PRIVATE:${CONTROL_HTTP_PORT:-24710}" -relay "http://$RELAY_PRIVATE:${RELAY_HTTP_PORT:-24700}" \
                  -worker-call-cap "$WORKER_CALL_CAP" "${workers[@]}"
                ;;
              signal)
                exec "$bin/relais-signal" -listen "$NODE_PRIVATE:${SIGNAL_PORT:-24743}" \
                  -control "http://$CONTROL_PRIVATE:${CONTROL_HTTP_PORT:-24710}" -advertise-ips "$NODE_PRIVATE" \
                  -token-file "${CREDENTIALS_DIRECTORY:?}/signal.token"
                ;;
              *) echo 'unknown component; start refused' >&2; exit 2 ;;
            esac
          mode: '000755'
